
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #243b55;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .empty {
            color: #777;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>Class Timetable</h1>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time Slot</th>
                <th>Subject</th>
                <th>Faculty Name</th>
                <th>Classroom</th>
            </tr>
        </thead>

        <tbody>
            {% for slot in slots %}
            <tr>
                <td>{{ slot.day }}</td>
                <td>
                    {{ slot.start_time|time:"H:i" }} -
                    {{ slot.end_time|time:"H:i" }}
                </td>
                <td>{{ slot.subject_name }}</td>
                <td>{{ slot.faculty_name }}</td>
                <td>{{ slot.classroom }}</td>
            </tr>

            {% empty %}
            <tr>
                <td colspan="5" class="empty">
                    No timetable records available.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
